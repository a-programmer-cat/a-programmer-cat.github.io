<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel's Interactive CSS Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a24;
            --desk-color: #e5a97a;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        body { margin: 0; height: 100vh; background-color: var(--bg-color); font-family: 'Poppins', sans-serif; overflow: hidden; }

        .desk {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 85vh; background: linear-gradient(135deg, #d39566, #e5a97a);
            border-radius: 20px; border: 8px solid #b87b4e;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 100px rgba(0,0,0,0.1);
        }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: 0.5s; z-index: 10; }
        .camera-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 999; }
        @keyframes flash-anim { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        .nameplate {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #d4af37; padding: 15px 40px; border-radius: 5px;
            color: #2c3e50; font-weight: 800; font-size: 1.5rem; letter-spacing: 2px;
            border: 3px solid #b5952f; box-shadow: 5px 10px 15px rgba(0,0,0,0.3);
            cursor: pointer; transition: 0.3s; z-index: 5;
        }
        .nameplate:hover { transform: translate(-50%, -52%) scale(1.05); }

        .laptop {
            position: absolute; top: 15%; left: 20%; width: 140px; height: 90px;
            background: #2c3e50; border-radius: 10px; cursor: pointer;
            box-shadow: 5px 10px 15px rgba(0,0,0,0.4); transition: transform 0.3s; z-index: 5;
        }
        .laptop-screen {
            position: absolute; top: 5px; left: 5px; right: 5px; bottom: 15px;
            background: #111; border-radius: 5px; transition: 0.5s;
        }
        .laptop-keyboard {
            position: absolute; bottom: 5px; left: 20%; right: 20%; height: 5px;
            background: #444; border-radius: 2px;
        }
        .laptop:hover { transform: scale(1.05) translateY(-5px); }
        .laptop.active .laptop-screen { background: #00f2fe; box-shadow: 0 0 20px #00f2fe; }
        .laptop.active .laptop-screen::after { content: "</>"; color: #fff; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-family: monospace; }

        .camera {
            position: absolute; top: 70%; left: 15%; width: 90px; height: 60px;
            background: #34495e; border-radius: 8px; cursor: pointer;
            box-shadow: 5px 10px 15px rgba(0,0,0,0.4); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 5;
        }
        .camera-lens {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; background: #111; border-radius: 50%;
            border: 4px solid #7f8c8d; box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }
        .camera-button { position: absolute; top: -5px; right: 15px; width: 15px; height: 5px; background: #e74c3c; border-radius: 3px 3px 0 0; }
        .camera:hover { transform: scale(1.1) translateY(-5px) rotate(-5deg); }
        .camera.active { position: fixed; top: 50%; left: 35%; transform: translate(-50%, -50%) scale(2.5); z-index: 20; box-shadow: 0 30px 40px rgba(0,0,0,0.6); }

        .book {
            position: absolute; top: 20%; right: 20%; width: 80px; height: 110px;
            background: #2980b9; border-radius: 2px 10px 10px 2px; cursor: pointer;
            box-shadow: 5px 10px 15px rgba(0,0,0,0.4); border-left: 5px solid #1c5980;
            transition: all 0.5s; z-index: 5; perspective: 1000px;
        }
        .book::after { content: 'MATH'; color: rgba(255,255,255,0.5); font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); letter-spacing: 2px; }
        .book-pages { position: absolute; top: 5px; bottom: 5px; right: 0; width: 10px; background: #fff; border-radius: 0 8px 8px 0; }
        .book:hover { transform: scale(1.05) translateY(-5px); }
        .book.active { transform: scale(1.5) translateX(-50px) rotateY(-20deg); z-index: 20; }

        .medal {
            position: absolute; top: 65%; right: 25%; width: 50px; height: 50px;
            background: #f1c40f; border-radius: 50%; cursor: pointer;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2), 5px 10px 15px rgba(0,0,0,0.4);
            border: 3px solid #f39c12; transition: all 0.5s; z-index: 5; transform-origin: top center;
        }
        .medal-ribbon {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 40px; background: linear-gradient(to right, #e74c3c 33%, #fff 33%, #fff 66%, #e74c3c 66%);
            z-index: -1; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
        }
        .medal::after { content: '1'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 800; color: #d35400; font-size: 1.2rem; }
        .medal:hover { transform: scale(1.1); }
        .medal.active { animation: swing 1.5s infinite ease-in-out; z-index: 20; }
        @keyframes swing { 0%, 100% { transform: scale(1.5) rotate(-15deg); } 50% { transform: scale(1.5) rotate(15deg); } }

        .info-card {
            position: fixed; top: 50%; left: 70%; transform: translate(-50%, -50%) translateX(100px) scale(0.9);
            background: var(--card-bg); width: 350px; padding: 30px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 20;
            opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .info-card.show { opacity: 1; transform: translate(-50%, -50%) translateX(0) scale(1); pointer-events: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #666; font-weight: bold; }
        .close-btn:hover { color: #e74c3c; }
        .card-title { font-size: 1.5rem; font-weight: 800; color: #333; margin: 0 0 15px 0; border-bottom: 3px solid #3498db; padding-bottom: 5px; display: inline-block; }
        .card-desc { color: #555; font-size: 0.95rem; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeItem()"></div>
    <div class="camera-flash" id="cameraFlash"></div>

    <div class="info-card" id="infoCard">
        <div class="close-btn" onclick="closeItem()">✖</div>
        <h2 class="card-title" id="cardTitle">Title</h2>
        <div class="card-desc" id="cardDesc">Description goes here.</div>
    </div>

    <div class="desk">
        
        <div class="nameplate" onclick="triggerInteraction(this, 'Samuel Kong', 'Welcome! I am a Form 3 student who loves coding, physics, scouting, and solving problems. Everything here is drawn purely with CSS!')">
            SAMUEL KONG
        </div>

        <div class="laptop item" id="laptop" onclick="triggerInteraction(this, 'Coding & Tech', '<b>CyberSavvy & Flood-Res:</b><br>I code to solve real problems. My screen is lit up with new ideas for Web, AI, and IoT development.')">
            <div class="laptop-screen"></div>
            <div class="laptop-keyboard"></div>
        </div>

        <div class="camera item" id="camera" onclick="triggerInteraction(this, 'Photography & Life', 'Say Cheese! 📸<br><br>Outside of coding and math, I love capturing moments, running for fitness, and performing in the Bagpipe band.')">
            <div class="camera-button"></div>
            <div class="camera-lens"></div>
        </div>

        <div class="book item" id="book" onclick="triggerInteraction(this, 'Math & Physics', '<b>AddMath Enthusiast</b><br><br>Multiple Gold & Silver awards in the Kangaroo Math Competition. I enjoy finding the logic behind how the universe operates.')">
            <div class="book-pages"></div>
        </div>

        <div class="medal item" id="medal" onclick="triggerInteraction(this, 'Achievements', '🏆 Champion - Sarawak Space Apps Challenge (2025)<br>🥇 Gold - Science Castle Malaysia<br>🥈 1st Runner Up - BugCrusher Hackathon')">
            <div class="medal-ribbon"></div>
        </div>

    </div>

    <script>
        let currentItem = null;

        function triggerInteraction(element, title, desc) {
            if(currentItem === element) return;
            
            if(currentItem) {
                closeItem();
                setTimeout(() => openLogic(element, title, desc), 600);
            } else {
                openLogic(element, title, desc);
            }
        }

        function openLogic(element, title, desc) {
            currentItem = element;
            
            if (element.id === 'camera') {
                const flash = document.getElementById('cameraFlash');
                flash.style.animation = 'none';
                setTimeout(() => { flash.style.animation = 'flash-anim 0.5s ease-out'; }, 400);
            }

            element.classList.add('active');
            
            document.getElementById('overlay').style.opacity = '1';
            document.getElementById('overlay').style.pointerEvents = 'auto';
            document.getElementById('cardTitle').innerHTML = title;
            document.getElementById('cardDesc').innerHTML = desc;
            
            setTimeout(() => {
                document.getElementById('infoCard').classList.add('show');
            }, 300);
        }

        function closeItem() {
            if(!currentItem) return;

            currentItem.classList.remove('active');
            currentItem = null;

            document.getElementById('infoCard').classList.remove('show');
            document.getElementById('overlay').style.opacity = '0';
            document.getElementById('overlay').style.pointerEvents = 'none';
        }
    </script>
</body>
</html>
