<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Kong</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --wall-color: #2c3e50;
            --desk-color: #e5a97a;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        body { margin: 0; height: 100vh; overflow: hidden; font-family: 'Poppins', sans-serif; background: var(--desk-color); }

        .scene { position: relative; width: 100vw; height: 100vh; }
        .wall { position: absolute; top: 0; width: 100%; height: 45%; background: linear-gradient(to bottom, #1a252f, var(--wall-color)); border-bottom: 12px solid #111820; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1; }
        .desk { position: absolute; bottom: 0; width: 100%; height: 55%; background: linear-gradient(135deg, #d39566, var(--desk-color)); z-index: 0; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: 0.5s; z-index: 50; }
        .camera-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 999; }
        @keyframes flash-anim { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        .item-wrapper { position: absolute; cursor: pointer; z-index: 10; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .item-wrapper:hover { transform: translateY(-8px) scale(1.05); }

        .desktop-setup { top: 38%; left: 50%; transform: translate(-50%, -50%); width: 240px; height: 260px; transition: 0.4s; }
        .desktop-setup:hover { transform: translate(-50%, -52%) scale(1.05); }
        .monitor { width: 240px; height: 150px; background: #222; border: 10px solid #dcdde1; border-radius: 12px; position: absolute; top: 0; box-shadow: 0 20px 30px rgba(0,0,0,0.5); transition: 0.4s; }
        .screen { position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; background: #111; border-radius: 4px; transition: 0.5s; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .stand { width: 50px; height: 40px; background: #7f8fa6; position: absolute; top: 168px; left: 95px; }
        .base { width: 120px; height: 12px; background: #dcdde1; position: absolute; top: 208px; left: 60px; border-radius: 6px 6px 0 0; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .keyboard { width: 180px; height: 50px; background: #dcdde1; position: absolute; top: 230px; left: 30px; border-radius: 6px; box-shadow: 0 15px 20px rgba(0,0,0,0.4); transform: perspective(400px) rotateX(30deg); display: flex; flex-wrap: wrap; padding: 4px; gap: 2px; }
        .desktop-setup.active .screen { background: #0984e3; box-shadow: 0 0 30px #0984e3; }
        .desktop-setup.active .screen::after { content: "System.out.println('Hello');"; color: #fff; font-family: 'Fira Code', monospace; font-size: 0.9rem; font-weight: bold; }

        .nameplate { top: 80%; left: 50%; transform: translateX(-50%); background: #d4af37; padding: 15px 50px; border-radius: 6px; border: 4px solid #b5952f; box-shadow: 0 15px 20px rgba(0,0,0,0.4); color: #2c3e50; font-weight: 900; font-size: 1.6rem; letter-spacing: 3px; }
        .nameplate:hover { transform: translateX(-50%) translateY(-5px) scale(1.05); }

        .books { top: 55%; left: 18%; width: 110px; height: 100px; }
        .book-layer { position: absolute; width: 100%; border-radius: 4px 12px 12px 4px; box-shadow: -5px 10px 15px rgba(0,0,0,0.3); border-left: 6px solid rgba(0,0,0,0.2); transition: 0.5s; }
        .b1 { height: 25px; background: #e74c3c; bottom: 0; }
        .b2 { height: 22px; background: #f1c40f; bottom: 25px; left: 5px; transform: rotate(-5deg); }
        .b3 { height: 28px; background: #3498db; bottom: 47px; right: 5px; transform: rotate(3deg); display: flex; align-items: center; justify-content: center; }
        .b3::after { content: 'MATH'; color: rgba(255,255,255,0.7); font-weight: 800; font-size: 0.8rem; letter-spacing: 2px; }
        .books.active .b3 { transform: translateY(-60px) rotate(10deg) scale(1.2); box-shadow: -10px 30px 20px rgba(0,0,0,0.4); z-index: 60; }

        .camera { top: 52%; right: 18%; width: 100px; height: 70px; background: #34495e; border-radius: 10px; box-shadow: 0 15px 25px rgba(0,0,0,0.4); }
        .cam-lens { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45px; height: 45px; background: #111; border-radius: 50%; border: 6px solid #7f8c8d; box-shadow: inset 0 0 15px rgba(255,255,255,0.3); }
        .cam-btn { position: absolute; top: -6px; right: 15px; width: 18px; height: 6px; background: #e74c3c; border-radius: 4px 4px 0 0; }
        .cam-flash { position: absolute; top: 10px; left: 10px; width: 15px; height: 10px; background: #f1c40f; border-radius: 2px; }
        .camera.active { position: fixed; top: 50%; left: 35%; transform: translate(-50%, -50%) scale(3); z-index: 60; box-shadow: 0 40px 50px rgba(0,0,0,0.6); }

        .medal { top: 75%; right: 25%; width: 60px; height: 60px; background: #f1c40f; border-radius: 50%; box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.4); border: 4px solid #f39c12; transform-origin: top center; display: flex; align-items: center; justify-content: center; }
        .medal-ribbon { position: absolute; top: -45px; left: 50%; transform: translateX(-50%); width: 25px; height: 45px; background: linear-gradient(to right, #e74c3c 33%, #fff 33%, #fff 66%, #e74c3c 66%); z-index: -1; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }
        .medal::after { content: '1'; font-weight: 900; color: #d35400; font-size: 1.5rem; }
        .medal.active { animation: swing 1.2s infinite ease-in-out; z-index: 60; }
        @keyframes swing { 0%, 100% { transform: scale(1.8) rotate(-20deg); } 50% { transform: scale(1.8) rotate(20deg); } }

        .info-card { position: fixed; top: 50%; left: 70%; transform: translate(-50%, -50%) translateX(50px) scale(0.9); background: var(--card-bg); width: 380px; padding: 35px; border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); z-index: 60; opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .info-card.show { opacity: 1; transform: translate(-50%, -50%) translateX(0) scale(1); pointer-events: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #666; font-weight: bold; transition: 0.3s; }
        .close-btn:hover { color: #e74c3c; transform: rotate(90deg); }
        .card-title { font-size: 1.8rem; font-weight: 900; color: #111; margin: 0 0 15px 0; display: inline-block; background: linear-gradient(90deg, #3498db, #2980b9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-desc { color: #444; font-size: 1rem; line-height: 1.7; }
    </style>
</head>
<body>

    <div class="scene">
        <div class="wall"></div>
        <div class="desk"></div>
        
        <div class="overlay" id="overlay" onclick="closeItem()"></div>
        <div class="camera-flash" id="cameraFlash"></div>

        <div class="info-card" id="infoCard">
            <div class="close-btn" onclick="closeItem()">✖</div>
            <h2 class="card-title" id="cardTitle"></h2>
            <div class="card-desc" id="cardDesc"></div>
        </div>

        <div class="item-wrapper desktop-setup" id="desktop" onclick="interact(this, 'Coding & Tech Projects', '<b>CyberSavvy:</b> Multi-language anti-scam platform.<br><br><b>Flood-Res:</b> Live IoT flood warning system.<br><br>I use Web, AI, and Hardware to build solutions that protect and prepare our local community.')">
            <div class="monitor"><div class="screen"></div></div>
            <div class="stand"></div>
            <div class="base"></div>
            <div class="keyboard"></div>
        </div>

        <div class="item-wrapper nameplate" onclick="interact(this, 'Samuel Kong', 'Vice Head Prefect II, Scout Drum Major, and a Form 3 student passionate about Physics, Math, and Software Development. Welcome to my digital desk!')">
            SAMUEL KONG
        </div>

        <div class="item-wrapper books" id="books" onclick="interact(this, 'Math & Physics', 'I am an AddMath and Physics enthusiast.<br><br>🏅 Kangaroo Math Competition (2021, 2023 Gold; 2025 Silver)<br>🏅 Catholic High Sibu Math & Science Champion<br><br>I love uncovering the patterns behind how the universe works.')">
            <div class="book-layer b1"></div>
            <div class="book-layer b2"></div>
            <div class="book-layer b3"></div>
        </div>

        <div class="item-wrapper camera" id="camera" onclick="interact(this, 'Photography & Life', 'Say Cheese! 📸<br><br>When I step away from the keyboard, I focus on photography, running for fitness, and leading the Bagpipe Band. I believe in maintaining a strong balance between the digital world and the outdoors.')">
            <div class="cam-btn"></div>
            <div class="cam-flash"></div>
            <div class="cam-lens"></div>
        </div>

        <div class="item-wrapper medal" id="medal" onclick="interact(this, 'Achievements', '🏆 Champion - Sarawak Space Apps Challenge<br>🥇 Gold - Science Castle Malaysia<br>🥈 1st Runner Up - Coolest Projects Malaysia<br>🥈 1st Runner Up - BugCrusher Hackathon')">
            <div class="medal-ribbon"></div>
        </div>
    </div>

    <script>
        let currentItem = null;

        function interact(el, title, desc) {
            if(currentItem === el) return;
            if(currentItem) {
                closeItem();
                setTimeout(() => openLogic(el, title, desc), 600);
            } else {
                openLogic(el, title, desc);
            }
        }

        function openLogic(el, title, desc) {
            currentItem = el;
            
            if (el.id === 'camera') {
                const flash = document.getElementById('cameraFlash');
                flash.style.animation = 'none';
                setTimeout(() => { flash.style.animation = 'flash-anim 0.6s ease-out'; }, 400);
            }

            el.classList.add('active');
            
            document.getElementById('overlay').style.opacity = '1';
            document.getElementById('overlay').style.pointerEvents = 'auto';
            document.getElementById('cardTitle').innerHTML = title;
            document.getElementById('cardDesc').innerHTML = desc;
            
            setTimeout(() => {
                document.getElementById('infoCard').classList.add('show');
            }, 300);
        }

        function closeItem() {
            if(!currentItem) return;
            currentItem.classList.remove('active');
            currentItem = null;
            document.getElementById('infoCard').classList.remove('show');
            document.getElementById('overlay').style.opacity = '0';
            document.getElementById('overlay').style.pointerEvents = 'none';
        }
    </script>
</body>
</html>
