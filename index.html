<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Kong - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F9F8F6;
        }

        .room-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wall {
            flex: 5.5;
            background-color: #F9F8F6;
            position: relative;
        }

        .desk {
            flex: 4.5;
            background-color: #D9CFC7;
            position: relative;
        }

    </style>
</head>
<body>
    <div class="room-container">
        <div class="wall"></div>
        <div class="desk"></div>
    </div>
</body>
</html>
