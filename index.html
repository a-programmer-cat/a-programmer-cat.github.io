<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Kong - Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .room-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border: 4px solid #2b2b2b;
        }

        .wall {
            flex: 5.5;
            background-color: #fceade;
            position: relative;
            border-bottom: 4px solid #2b2b2b;
        }

        .desk {
            flex: 4.5;
            background-color: #d89663;
            position: relative;
            border-top: 4px solid #2b2b2b;
        }

        .desk::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background-color: #eab48a;
            border-bottom: 3px solid #2b2b2b;
        }
    </style>
</head>
<body>
    <div class="room-container">
        <div class="wall"></div>
        <div class="desk"></div>
    </div>
</body>
</html>
